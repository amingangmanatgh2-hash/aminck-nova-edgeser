plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.16'
}

version = '1.0.0'
group = 'com.nova.horror'
archivesBaseName = 'novahorror-forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')}"

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

dependencies {
    implementation fg.deobf('net.minecraftforge:forge:1.20.1-47.1.0')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1', minecraft_version_range: '[1.20,1.21)',
            forge_version: '47.1.0', forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: 'novahorror', mod_name: 'Nova Horror', mod_license: 'MIT',
            mod_version: project.version, mod_authors: 'AMINCK Nova', mod_description: 'God-tier horror mod - custom entities, fear system, jumpscares'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
