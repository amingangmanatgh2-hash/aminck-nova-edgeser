modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/amingangmanatgh2-hash/aminck-nova-edgeser/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="https://example.com/novahorror/update.json"
displayURL="https://example.com/novahorror"
logoFile="novahorror_logo.png"
credits="AMINCK Nova Edge - Horror Project"
