# Nova Horror - God-tier Horror Shader
# Compatible with Iris 1.6+ and OptiFine HD U I5+
# Author: AMINCK Nova Edge

# Shader properties
shadowMapResolution=2048
shadowDistance=120.0
shadowDistanceRenderMul=1.0
shadowIntervalSize=2.0
generateShadowMipmap=true
generateShadowColorMipmap=true
shadowHardwareFiltering=true
shadowHardwareFiltering0=true
shadowHardwareFiltering1=true

# Colors
fogColor=0.08 0.09 0.12
skyColor=0.06 0.07 0.10
sunPathRotation=-15.0
twilightPhase=0.8

# Volumetric fog
volumetricFog=true
volumetricFogDensity=0.8

# Horror specific
HORROR_MODE=1
FEAR_DARKNESS=0.85
BLOOD_MOON=0
